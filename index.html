<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Санның құрамы — 2–10</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Times New Roman',serif;font-weight:900;background:linear-gradient(145deg,#d8f8ff,#fff2b7 55%,#f7d9ff);color:#173058;min-height:100dvh}button{font:inherit;cursor:pointer;touch-action:manipulation}.app{max-width:1100px;margin:auto;padding:clamp(12px,3vw,28px)}header{text-align:center}.title{font-size:clamp(30px,5.5vw,62px);color:#c22b72;text-shadow:2px 3px #fff;margin:8px 0}.subtitle{font-size:clamp(18px,2.5vw,29px);margin:8px 0 20px}.chooser{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vw,20px);max-width:730px;margin:20px auto}.num{border:5px solid #fff;border-radius:28px;min-height:clamp(100px,18vw,158px);font-size:clamp(55px,10vw,100px);color:white;text-shadow:2px 4px #0004;box-shadow:0 8px 0 #0002,0 10px 22px #0002;transition:transform .15s}.num:active,.choice:active{transform:scale(.95)}.num:nth-child(9n+1){background:#f45770}.num:nth-child(9n+2){background:#fa9e2f}.num:nth-child(9n+3){background:#5fbb63}.num:nth-child(9n+4){background:#389ce2}.num:nth-child(9n+5){background:#a675e9}.num:nth-child(9n+6){background:#e26aa7}.num:nth-child(9n+7){background:#17b7b5}.num:nth-child(9n+8){background:#e2b629}.num:nth-child(9n+9){background:#7d75d9}.hidden{display:none!important}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.small{border:3px solid #fff;background:#407cd9;color:white;border-radius:16px;padding:9px 17px;font-size:clamp(17px,2.5vw,25px);box-shadow:0 4px #0002}.stats{font-size:clamp(18px,2.8vw,29px);background:#ffffffdb;padding:9px 15px;border-radius:17px}.stage{margin:18px auto 12px;background:#fff9e8;border:6px solid #f3bc62;border-radius:30px;box-shadow:0 9px 0 #e4a44e44;padding:clamp(12px,3vw,28px);text-align:center}.prompt{font-size:clamp(24px,3.5vw,40px);color:#8c3b99}.equation{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,28px);margin:16px auto;flex-wrap:wrap}.bubble{display:grid;place-items:center;width:clamp(75px,17vw,150px);height:clamp(75px,17vw,150px);border:5px solid white;border-radius:26px;box-shadow:0 7px 0 #0002;color:white;font-size:clamp(45px,10vw,92px)}.bubble.a{background:#f46c71}.bubble.b{background:#409de2}.bubble.total{background:#55b86b}.operator{font-size:clamp(37px,8vw,72px);color:#6c488e}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(9px,2vw,18px);max-width:750px;margin:20px auto}.choice{min-height:clamp(88px,16vw,145px);border:5px solid white;border-radius:26px;background:#ffba41;color:#28335b;font-size:clamp(45px,9vw,88px);box-shadow:0 7px #d18c29}.choice:nth-child(2){background:#9ce2ff;box-shadow:0 7px #57a6cc}.choice:nth-child(3){background:#c6a8fa;box-shadow:0 7px #9673d2}.choice:disabled{opacity:.65}.message{min-height:55px;text-align:center;font-size:clamp(24px,4vw,40px);color:#148049}.message.bad{color:#c63c48}.end{text-align:center;background:white;border:6px solid #ffcc58;border-radius:30px;padding:30px 15px;margin:25px auto;max-width:700px}.end h2{font-size:clamp(34px,6vw,60px);color:#d84c7a}.end p{font-size:clamp(23px,4vw,37px)}.again{background:#48ba80;color:white;border:4px solid #fff;border-radius:20px;padding:15px 25px;font-size:clamp(23px,4vw,35px)}.help{text-align:center;font-size:clamp(17px,2.4vw,24px);margin-top:18px}.progress{height:16px;background:#e4e6f2;border-radius:20px;overflow:hidden;margin:14px auto;max-width:760px}.fill{height:100%;width:0;background:linear-gradient(90deg,#52c6a1,#4f9fe8);transition:width .3s}@media(max-width:480px){.app{padding:10px}.num{border-radius:19px;min-height:98px}.stage{border-width:4px;border-radius:21px}.bubble{border-radius:20px}.equation{gap:7px}.operator{font-size:39px}.choice{border-radius:20px}.bar{justify-content:center}.stats{font-size:17px}.title{font-size:33px}}

/* Сан құрамы: жоғарғы саннан екі бөлікке таралатын көрнекі сызба */
.number-tree{display:flex;flex-direction:column;align-items:center;margin:14px auto 10px;max-width:430px}
.tree-total{display:grid;place-items:center;width:clamp(90px,19vw,145px);height:clamp(80px,16vw,125px);background:#f5bd49;border:5px solid white;border-radius:24px;box-shadow:0 6px #b98628;color:#48250c;font-size:clamp(55px,11vw,95px)}
.tree-lines{width:min(85%,330px);height:clamp(48px,10vw,85px);overflow:visible}
.tree-parts{display:flex;justify-content:space-between;width:min(90%,360px);gap:22px}
.tree-part{display:grid;place-items:center;width:clamp(95px,22vw,155px);height:clamp(88px,19vw,135px);border:5px solid white;border-radius:25px;box-shadow:0 7px #0002;color:#162c49;font-size:clamp(60px,12vw,100px)}
.tree-part.a{background:#f49ca9}.tree-part.b{background:#8bcaf4}
.play-actions,.end-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px auto}
.action-choose{background:#3d8be0!important;color:white!important}.action-again{background:#48ba80!important;color:white!important}
@media(max-width:480px){.number-tree{margin:10px auto}.tree-lines{height:55px}.tree-parts{width:min(95%,310px)}.tree-part{border-radius:17px}.tree-total{border-radius:17px}.play-actions .small{font-size:18px;padding:9px 12px}}
/* Барлық жауап сандары бірден көрінеді: 2 үшін 0–2, 10 үшін 0–10. */
.choices{grid-template-columns:repeat(auto-fit,minmax(76px,1fr));max-width:950px;gap:12px;margin:18px auto}
.choice{min-height:82px;font-size:clamp(35px,5vw,65px);border-radius:18px;border-width:4px}
.choice:nth-child(5n+1){background:#ffba41;box-shadow:0 5px #d18c29}
.choice:nth-child(5n+2){background:#9ce2ff;box-shadow:0 5px #57a6cc}
.choice:nth-child(5n+3){background:#c6a8fa;box-shadow:0 5px #9673d2}
.choice:nth-child(5n+4){background:#a9e8ad;box-shadow:0 5px #65b46a}
.choice:nth-child(5n){background:#ffacc7;box-shadow:0 5px #d47a98}
@media(max-width:600px){.choices{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:12px auto}.choice{min-height:58px;font-size:clamp(28px,8vw,43px);border-width:2px;border-radius:12px}.tree-total{height:78px}.tree-part{height:80px}.tree-lines{height:42px}.stage{padding-top:6px;padding-bottom:6px}}
</style></head><body><div class="app"><header><h1 class="title">🌈 Санның құрамы 🌈</h1><p class="subtitle">2-ден 10-ға дейін • Барлық жауап сандары экранда!</p></header><section id="home"><div class="chooser" id="chooser"></div><p class="help">Қалаған санды басып, ойынды баста!</p></section><section id="play" class="hidden"><div class="bar"><button class="small action-choose" id="back">▦ Таңдау</button><div class="stats" id="counter">1 / 10</div><div class="stats" id="timer">⏱ 00:00</div></div><div class="progress"><div class="fill" id="fill"></div></div><div class="stage"><div class="prompt" id="prompt">Төмендегі барлық сандардың ішінен дұрысын таңда!</div><div class="number-tree" aria-label="Санның құрамын тап"><div class="tree-total" id="total">7</div><svg class="tree-lines" viewBox="0 0 330 85" preserveAspectRatio="none" aria-hidden="true"><path d="M165 3 V26 M165 26 L66 80 M165 26 L264 80" fill="none" stroke="#df9b32" stroke-width="7" stroke-linecap="round"/></svg><div class="tree-parts"><div class="tree-part a" id="left">1</div><div class="tree-part b" id="right">?</div></div></div></div><div class="choices" id="choices"></div><div class="message" id="message" aria-live="polite"></div><div class="play-actions"><button class="small action-again" id="restart">↻ Қайта ойнау</button><button class="small action-choose" id="select">▦ Таңдау</button></div></section><section id="end" class="end hidden"><h2>🏆 ЖАРАЙСЫҢ!</h2><p id="result"></p><div class="end-actions"><button class="again" id="again">↻ Қайта ойнау</button><button class="again action-choose" id="all">▦ Таңдау</button></div></section></div><script>
const $=id=>document.getElementById(id);let number=2,items=[],index=0,started=0,ticker=null,locked=false,ac=null;function sound(ok){try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();const notes=ok?[523,659,784]:[260,190];notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.11;o.type=ok?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.14,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)})}catch(e){}}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function show(which){['home','play','end'].forEach(id=>$(id).classList.toggle('hidden',id!==which))}function start(n){clearInterval(ticker);number=n;items=shuffle(Array.from({length:n+1},(_,a)=>({a,b:n-a,hide:Math.random()<.5?'a':'b'})));index=0;started=Date.now();locked=false;show('play');ticker=setInterval(()=>$('timer').textContent='⏱ '+fmt(Math.floor((Date.now()-started)/1000)),250);$('timer').textContent='⏱ 00:00';render()}function choices(correct){return Array.from({length:number+1},(_,i)=>i)}function render(){locked=false;const t=items[index],correct=t[t.hide];$('counter').textContent=`${index+1} / ${items.length}`;$('fill').style.width=(index/items.length*100)+'%';$('prompt').textContent=`${number} санының құрамын тап!`;$('left').textContent=t.hide==='a'?'?':t.a;$('right').textContent=t.hide==='b'?'?':t.b;$('total').textContent=number;$('message').textContent='';$('message').classList.remove('bad');$('choices').replaceChildren(...choices(correct).map(v=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>answer(v,correct,b);return b}))}function answer(v,correct,button){if(locked)return;if(v!==correct){sound(false);$('message').textContent='Тағы ойланып көр!';$('message').classList.add('bad');button.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:270});return}locked=true;sound(true);const t=items[index];$(t.hide==='a'?'left':'right').textContent=correct;$('message').classList.remove('bad');$('message').textContent='🌟 Жарайсың!';[...$('choices').children].forEach(b=>b.disabled=true);setTimeout(()=>{index++;if(index===items.length)finish();else render()},650)}function finish(){clearInterval(ticker);$('fill').style.width='100%';$('result').innerHTML=`${number} санының барлық ${items.length} құрамын таптың!<br>⏱ Уақытың: <b>${fmt(Math.floor((Date.now()-started)/1000))}</b>`;show('end')}for(let n=2;n<=10;n++){let b=document.createElement('button');b.className='num';b.textContent=n;b.onclick=()=>start(n);$('chooser').appendChild(b)}$('back').onclick=()=>{clearInterval(ticker);show('home')};$('again').onclick=()=>start(number);$('restart').onclick=()=>start(number);$('select').onclick=()=>{clearInterval(ticker);show('home')};$('all').onclick=()=>{clearInterval(ticker);show('home')};
</script></body></html>
